name = "reparzo-website"
main = "worker.js"
compatibility_date = "2026-08-04"

routes = [
  { pattern = "reparzo.com/*", zone_name = "reparzo.com" },
  { pattern = "www.reparzo.com/*", zone_name = "reparzo.com" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[services]]
binding = "BACKEND"
service = "reparzo-backend"

[vars]
API_FALLBACK_URL = "https://reparzo-backend.reparzo-backend.workers.dev"
